name: TimeUp Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 20

    steps:
      - name: Checkout TimeUp
        uses: actions/checkout@v4

      - name: Check Xcode
        run: |
          sw_vers
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build TimeUp
        run: |
          set -o pipefail
          xcodebuild \
            -project TimeUp.xcodeproj \
            -scheme TimeUp \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Prepare iPhone simulator
        run: |
          set -euo pipefail
          xcrun simctl shutdown all || true
          xcrun simctl erase all || true
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for runtime in d.values() for x in runtime if x["name"] == "iPhone 17"))')"
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID"
          open -a Simulator --args -CurrentDeviceUDID "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          sleep 10
          xcrun simctl status_bar "$DEVICE_ID" clear || true

      - name: Test TimeUp
        timeout-minutes: 10
        run: |
          set -o pipefail
          xcodebuild \
            -project TimeUp.xcodeproj \
            -scheme TimeUp \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO \
            test
