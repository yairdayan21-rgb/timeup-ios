name: TimeUp Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-26-intel

    steps:
      - name: Checkout TimeUp
        uses: actions/checkout@v4

      - name: Check Xcode
        run: |
          sw_vers
          xcodebuild -version

      - name: Build TimeUp
        run: |
          xcodebuild \
            -project TimeUp.xcodeproj \
            -scheme TimeUp \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
