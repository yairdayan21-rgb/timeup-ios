name: TimeUp

options:
  bundleIdPrefix: com.timeup

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.0.0

targets:
  TimeUp:
    type: application
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - TimeUp/Sources
    dependencies:
      - package: Supabase
        product: Supabase
      - target: TimeUpDeviceActivityMonitor
        embed: true
      - target: TimeUpDeviceActivityReport
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timeup.app
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: TimeUp/TimeUp.entitlements
        INFOPLIST_KEY_NSFaceIDUsageDescription: "TimeUp uses Face ID to securely unlock your account."

  TimeUpDeviceActivityMonitor:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - TimeUpDeviceActivityMonitor/Sources
    info:
      path: TimeUpDeviceActivityMonitor/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timeup.app.DeviceActivityMonitor
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: TimeUpDeviceActivityMonitor/TimeUpDeviceActivityMonitor.entitlements

  TimeUpDeviceActivityReport:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - TimeUpDeviceActivityReport/Sources
    info:
      path: TimeUpDeviceActivityReport/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivityui.report-extension
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).DeviceActivityReportExtension"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timeup.app.DeviceActivityReport
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: TimeUpDeviceActivityReport/TimeUpDeviceActivityReport.entitlements

  TimeUpUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - TimeUpUITests
    dependencies:
      - target: TimeUp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TimeUp:
    build:
      targets:
        TimeUp: all
        TimeUpDeviceActivityMonitor: all
        TimeUpDeviceActivityReport: all
        TimeUpUITests: [test]
    test:
      targets:
        - TimeUpUITests
