name: TimeUp

options:
  bundleIdPrefix: com.timeup

targets:
  TimeUp:
    type: application
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - TimeUp/Sources
    dependencies:
      - target: TimeUpDeviceActivityMonitor
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timeup.app
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: TimeUp/TimeUp.entitlements

  TimeUpDeviceActivityMonitor:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - TimeUpDeviceActivityMonitor/Sources
    info:
      path: TimeUpDeviceActivityMonitor/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timeup.app.DeviceActivityMonitor
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: TimeUpDeviceActivityMonitor/TimeUpDeviceActivityMonitor.entitlements

  TimeUpUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - TimeUpUITests
    dependencies:
      - target: TimeUp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TimeUp:
    build:
      targets:
        TimeUp: all
        TimeUpDeviceActivityMonitor: all
        TimeUpUITests: [test]
    test:
      targets:
        - TimeUpUITests
